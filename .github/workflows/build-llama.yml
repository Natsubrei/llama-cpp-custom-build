name: Build llama.cpp CUDA All Quants

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          path: llama-src
          fetch-depth: 1

      - name: Install CUDA 13.3
        uses: ./llama-src/.github/actions/windows-setup-cuda
        with:
          cuda_version: "13.3"
          cuda_arch: "x64"

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
      
          cmake -S llama-src -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=120a-real ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release --target llama-server -j %NUMBER_OF_PROCESSORS%

      - name: Copy CUDA runtime DLLs
        shell: powershell
        run: |
          $dst = "build\bin\Release"

          Get-ChildItem "$env:CUDA_PATH\bin" -Filter "cudart64_*.dll" |
            Copy-Item -Destination $dst

          Get-ChildItem "$env:CUDA_PATH\bin" -Filter "cublas64_*.dll" |
            Copy-Item -Destination $dst

          Get-ChildItem "$env:CUDA_PATH\bin" -Filter "cublasLt64_*.dll" |
            Copy-Item -Destination $dst

      - name: Verify build
        shell: powershell
        run: |
          $bin = "build\bin\Release"
      
          if (!(Test-Path "$bin\llama-server.exe")) {
            throw "llama-server.exe was not built"
          }
      
          if (!(Test-Path "$bin\ggml-cuda.dll")) {
            throw "ggml-cuda.dll was not built"
          }
      
          $cache = Get-Content "build\CMakeCache.txt"
      
          $required = @(
            "GGML_CUDA:BOOL=ON",
            "GGML_CUDA_FA:BOOL=ON",
            "GGML_CUDA_FA_ALL_QUANTS:BOOL=ON"
          )
      
          foreach ($item in $required) {
            if (-not ($cache -match [regex]::Escape($item))) {
              throw "Missing required build option: $item"
            }
          }
      
          Write-Host ""
          Write-Host "===== CUDA build verified ====="
          Write-Host "llama-server.exe: OK"
          Write-Host "ggml-cuda.dll: OK"
          Write-Host "GGML_CUDA: ON"
          Write-Host "GGML_CUDA_FA: ON"
          Write-Host "GGML_CUDA_FA_ALL_QUANTS: ON"
      
          Write-Host ""
          Write-Host "===== CUDA build configuration ====="
          Select-String `
            -Path "build\CMakeCache.txt" `
            -Pattern "GGML_CUDA|CMAKE_CUDA_ARCHITECTURES"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: llama-cpp-win-cuda13.3-blackwell-all-quants
          path: build/bin/Release/*
